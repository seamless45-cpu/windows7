# Optional, fully automatic publishing.
#
# The Arena GitHub App cannot push files under .github/workflows/, so this
# workflow ships as a template. To let GitHub build and deploy the site on
# every push (instead of running `npm run build:pages` by hand):
#
#   1. copy this file to .github/workflows/pages.yml
#   2. commit and push it from a normal git client or the GitHub web UI
#   3. Settings -> Pages -> Source: "GitHub Actions"
#
# Until then, `npm run build:pages && git commit` publishes the site into the
# repository root, which the current legacy Pages configuration serves.
name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx next build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
